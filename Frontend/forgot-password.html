<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBite - Forgot Password</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    .steps-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ddd;
      transition: 0.3s;
    }
    .step-dot.active {
      background: #16c451;
      width: 28px;
      border-radius: 5px;
    }
    #step-confirm {
      display: none;
      text-align: center;
    }
    .success-icon {
      width: 70px;
      height: 70px;
      background: #e9f1ec;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 1rem;
    }
    .success-icon i {
      color: #16c451;
      font-size: 2rem;
    }
  </style>
</head>

<body>

<div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">

  <!-- LOGO -->
  <a href="index.php" class="text-decoration-none">
    <div class="logo mb-4">
      <i class="fa-solid fa-utensils me-2 icon-green"></i>
      <span>Smart</span>Bite
    </div>
  </a>

  <!-- CARD -->
  <div class="card p-4 w-100" style="max-width: 400px;">

    <!-- STEPS -->
    <div class="steps-indicator">
      <div class="step-dot active" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
    </div>

    <!-- STEP 1 -->
    <div id="step1">
      <a href="signin.html" class="forgot">
        <i class="fa fa-arrow-left"></i> Back to Sign In
      </a>

      <h5 class="mt-2 fw-bold">Forgot your password?</h5>
      <p class="text-muted small mb-4">
        Enter your email and we’ll send you a reset link.
      </p>

      <form action="/SmartBite/Backend/api/auth/forgot-password.php" method="POST" id="form">
        
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa fa-envelope"></i></span>
            <input type="email" name="email" class="form-control"
            placeholder="name@example.com"
            required>
          </div>
        </div>

        <button type="submit" class="btn btn-green w-100" id="btn">
          Send Reset Link <i class="fa fa-paper-plane ms-1"></i>
        </button>
      </form>
    </div>

    <!-- STEP 2 -->
    <div id="step-confirm">
      <div class="success-icon">
        <i class="fa fa-envelope-circle-check"></i>
      </div>

      <h5 class="fw-bold mt-2">Check your email</h5>
      <p class="text-muted small">
        If the email exists, a reset link has been sent.
      </p>

      <p class="text-muted small">
        The link expires in <strong>5 minutes</strong>.
      </p>

      <a href="signin.html" class="btn btn-green w-100 mt-3">
        Back to Sign In
      </a>
    </div>

  </div>
</div>

<!-- JS -->
<script>

const params = new URLSearchParams(window.location.search);

// STEP SWITCH
if (params.get("sent") === "1") {
  document.getElementById("step1").style.display = "none";
  document.getElementById("step-confirm").style.display = "block";

  document.getElementById("dot1").classList.remove("active");
  document.getElementById("dot2").classList.add("active");
}
// ERREUR COMPTE GOOGLE
if (params.get("error") === "use_google") {
  const card = document.querySelector(".card");
  const alert = document.createElement("div");
  alert.className = "alert alert-warning mt-3";
  alert.innerHTML = '<i class="fa fa-google me-2"></i>This account uses Google Sign-In. <a href="signin.html">Sign in with Google</a> instead.';
  document.getElementById("step1").appendChild(alert);
}
// LOADING BUTTON
document.getElementById("form").addEventListener("submit", () => {
  document.getElementById("btn").innerHTML = "Sending...";
});

</script>

</body>
</html>
